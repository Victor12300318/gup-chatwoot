version: '3.8'

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3006}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    networks:
      - default

networks:
  default:
    name: easypanel
    external: true
